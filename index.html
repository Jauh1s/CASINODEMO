  const start = () => { if (!take(bet)) return; setG({ bombs: shuffle([...Array(25).keys()]).slice(0, m), open: [], over: false, bet }); setMsg("Pick a tile…"); };
  const cash = (s = g!) => { const p = Math.floor(s.bet * mineMult(s.open.length, m)); pay("Mines", s.bet, p, `${m} mines · ${s.open.length} gems · ×${mineMult(s.open.length, m).toFixed(2)}`); setG({ ...s, over: true }); setMsg(`Cashed out ${p.toLocaleString()}!`); };
  const click = (i: number) => {
    if (!g || g.over || g.open.includes(i)) return;
    if (g.bombs.includes(i)) { pay("Mines", g.bet, 0, `${m} mines · hit a mine after ${k} gems`); setG({ ...g, open: [...g.open, i], over: true }); setMsg("💥 Boom! You hit a mine."); return; }
    const s = { ...g, open: [...g.open, i] }; setG(s);
    if (s.open.length === 25 - m) cash(s); else setMsg(`Next tile pays ×${mineMult(s.open.length + 1, m).toFixed(2)}`);
  };
  return <Shell title="Mines" icon="💣"><Card className="space-y-4"><Bet v={bet} set={setBet} off={live} />
    <div><label className="text-xs text-white/50">Mines</label><select value={m} disabled={live} onChange={e => setM(+e.target.value)}>{[1, 3, 5, 10, 15, 20, 24].map(x => <option key={x} value={x}>{x}</option>)}</select></div>
    {live ? <Btn className="w-full" onClick={() => cash()} disabled={!k}>Cash out ×{mineMult(k, m).toFixed(2)}</Btn> : <Btn className="w-full" onClick={start}>START ROUND</Btn>}</Card>
    <Card><div className="mx-auto grid max-w-sm grid-cols-5 gap-2">{[...Array(25).keys()].map(i => { const o = g?.open.includes(i), b = g?.bombs.includes(i), show = o || (g?.over && b);
      return <button key={i} onClick={() => click(i)} disabled={!live} className={`aspect-square rounded-lg text-2xl transition ${show ? (b ? "bg-red-900" : "bg-green-900") + " animate-pop" : "bg-plum hover:bg-purple-800"}`}>{show ? (b ? "💣" : "💎") : ""}</button>; })}</div><Msg>{msg}</Msg></Card></Shell>;
}

const MAP: Record<string, () => JSX.Element> = { slots: Slots, blackjack: Blackjack, roulette: Roulette, coinflip: CoinFlip, dice: Dice, mines: Mines };
function GameView({ slug }: { slug: string }) {
  const { ready } = useCasino(); const G = MAP[slug];
  if (!ready) return <div className="mx-auto max-w-5xl animate-pulse px-4 py-8"><div className="mb-6 h-9 w-48 rounded bg-white/10" /><div className="grid gap-6 md:grid-cols-[300px_1fr]"><div className="h-64 rounded-2xl bg-white/10" /><div className="h-64 rounded-2xl bg-white/10" /></div></div>;
  return <G />;
}

const useHash = () => { const [h, setH] = useState(location.hash || "#/"); useEffect(() => { const f = () => { setH(location.hash || "#/"); window.scrollTo(0, 0); }; addEventListener("hashchange", f); return () => removeEventListener("hashchange", f); }, []); return h; };
function Navbar() {
  const { user } = useCasino();
  return <header className="sticky top-0 z-40 border-b border-gold/20 bg-ink/80 backdrop-blur"><div className="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-2 px-4 py-3">
    <a href="#/" className="text-lg font-black tracking-wider text-gold">♠ ROYAL<span className="text-white">DEMO</span></a>
    <nav className="flex items-center gap-4 text-sm"><a href="#/" className="hover:text-gold">Games</a><a href="#/history" className="hover:text-gold">History</a><a href="#/login" className="hover:text-gold">{user ? "👤 " + user.name : "Sign in"}</a>
      <span className="rounded-full border border-red-400/60 bg-red-500/10 px-2 py-0.5 text-xs font-bold text-red-300">DEMO</span>
      <span className="rounded-xl border border-gold/40 bg-plum px-3 py-1 font-bold text-gold">🪙 <Balance /></span></nav></div></header>;
}
function Footer() {
  return <footer className="mt-16 border-t border-gold/20 py-8 text-center text-xs text-white/50"><p className="font-bold text-gold">DEMO / PLAY MONEY</p>
    <p className="mx-auto mt-2 max-w-xl px-4">This is a fictional play-money casino. Credits are virtual, have no monetary value, cannot be bought, withdrawn or exchanged, and no prizes are awarded. For entertainment and learning only.</p></footer>;
}
function Home() {
  const { user } = useCasino();
  return <div className="mx-auto max-w-6xl px-4"><section className="py-16 text-center">
    <span className="rounded-full border border-red-400/60 bg-red-500/10 px-3 py-1 text-xs font-bold tracking-widest text-red-300">DEMO / PLAY MONEY</span>
    <h1 className="mt-6 text-5xl font-black md:text-7xl"><span className="bg-gradient-to-r from-gold via-yellow-200 to-gold bg-clip-text text-transparent">Royal Demo</span> Casino</h1>
    <p className="mx-auto mt-4 max-w-xl text-white/60">Six polished games, zero risk. Play with virtual credits only — nothing here has monetary value.</p>
    <p className="mt-6 text-2xl font-bold text-gold">🪙 <Balance /> credits</p>
    <p className="mt-2 text-sm text-white/60">{user ? `Signed in as ${user.name} — progress saved to the cloud ☁️` : <a href="#/login" className="underline hover:text-gold">Sign in to save your progress across devices</a>}</p>
    <button onClick={() => document.getElementById("games")!.scrollIntoView({ behavior: "smooth" })} className="mt-6 rounded-xl bg-gradient-to-b from-gold to-yellow-700 px-8 py-3 font-bold text-black transition hover:scale-105">Start playing</button></section>
    <section id="games" className="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">{GAMES.map(g => <a key={g.slug} href={`#/play/${g.slug}`} className="group rounded-2xl border border-gold/20 bg-white/[0.04] p-6 transition hover:-translate-y-1 hover:border-gold hover:shadow-[0_0_30px_rgba(212,175,55,.25)]">
      <div className="text-5xl transition group-hover:scale-110">{g.icon}</div><h2 className="mt-4 text-xl font-bold text-gold">{g.title}</h2><p className="mt-1 text-sm text-white/60">{g.desc}</p></a>)}</section></div>;
}
function History() {
  const { user, ready, name, setName, history, reset, clear } = useCasino();
  return <div className="mx-auto max-w-4xl space-y-6 px-4 py-8"><h1 className="text-3xl font-bold text-gold">Player &amp; History</h1>
    <Card className="grid gap-4 sm:grid-cols-[1fr_auto_auto] sm:items-end"><div><label className="text-xs uppercase tracking-widest text-white/50">Demo username</label><input value={name} maxLength={20} disabled={!!user} onChange={e => setName(e.target.value)} /></div>
      <Btn onClick={() => window.confirm("Reset balance to 10,000 and clear history?") && reset()}>Reset balance</Btn><Btn className="!bg-none !bg-white/10 !text-white" onClick={clear} disabled={!history.length}>Clear history</Btn></Card>
    <Card>{!ready ? <div className="h-24 animate-pulse rounded bg-white/10" /> : !history.length ? <p className="py-10 text-center text-white/50">🎲 No rounds yet — play a game and your results will appear here.</p> :
      <div className="overflow-x-auto"><table className="w-full text-left text-sm"><thead className="text-white/50"><tr><th className="p-2">Game</th><th>Details</th><th>Bet</th><th>Result</th><th>Time</th></tr></thead><tbody>{history.map(h => <tr key={h.id} className="border-t border-white/10"><td className="p-2">{h.game}</td><td>{h.note}</td><td>{h.bet.toLocaleString()}</td>
        <td className={h.win > 0 ? "text-green-400" : h.win < 0 ? "text-red-400" : "text-white/60"}>{h.win > 0 ? "+" : ""}{h.win.toLocaleString()}</td><td className="text-white/40">{new Date(h.t).toLocaleTimeString()}</td></tr>)}</tbody></table></div>}</Card></div>;
}
function Login() {
  const { user, signUp, signIn, signOut, toast } = useCasino();
  const [mode, setMode] = useState<"in" | "up">("in"), [u, setU] = useState(""), [p, setP] = useState(""), [busy, setBusy] = useState(false);
  const submit = async () => {
    if (!/^[a-zA-Z0-9_]{3,20}$/.test(u)) return toast("Username: 3–20 letters, numbers or _", false);
    if (p.length < 6) return toast("Password must be at least 6 characters", false);
    setBusy(true);
    try { await (mode === "up" ? signUp(u, p) : signIn(u, p)); toast(mode === "up" ? "Account created!" : "Signed in!"); location.hash = "#/"; }
    catch (e: any) { const c = String(e.code || ""); toast(c.includes("email-already") ? "Username already taken" : c.includes("password") || c.includes("user-not-found") || c.includes("invalid-credential") ? (mode === "up" ? "Password too weak" : "Wrong username or password") : e.message, false); }
    setBusy(false);
  };
  return <div className="mx-auto max-w-md px-4 py-10"><Card className="space-y-4">
    <h1 className="text-2xl font-bold text-gold">{user ? "Your account" : mode === "in" ? "Sign in" : "Create account"}</h1>
    {!CLOUD ? <p className="text-sm text-white/70">Cloud saving isn't set up yet. Add your Firebase config near the top of index.html to enable accounts. Until then your progress is saved only in this browser.</p>
    : user ? <><p>Signed in as <b className="text-gold">{user.name}</b>. Your balance and history are saved to your account and follow you to any device.</p><Btn className="w-full" onClick={() => { signOut(); location.hash = "#/"; }}>Sign out</Btn></>
    : <><div className="grid grid-cols-2 gap-2"><Chip on={mode === "in"} onClick={() => setMode("in")}>Sign in</Chip><Chip on={mode === "up"} onClick={() => setMode("up")}>Sign up</Chip></div>
      <input placeholder="Username (fake name is fine)" value={u} maxLength={20} autoComplete="username" onChange={e => setU(e.target.value)} />
      <input type="password" placeholder="Password (6+ characters)" value={p} autoComplete={mode === "up" ? "new-password" : "current-password"} onChange={e => setP(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()} />
      <Btn className="w-full" onClick={submit} disabled={busy}>{busy ? "Please wait…" : mode === "in" ? "Sign in" : "Create account"}</Btn>
      <p className="text-xs text-white/40">No email needed. Don't reuse a real password — this is a play-money demo and there is no password reset.</p></>}
  </Card></div>;
}
function App() {
  const h = useHash(), slug = h.startsWith("#/play/") ? h.slice(7) : "";
  return <><div className="bg-red-600/90 py-1 text-center text-xs font-bold tracking-widest text-white">DEMO / PLAY MONEY — VIRTUAL CREDITS ONLY</div><Navbar />
    <main>{slug && GAMES.some(g => g.slug === slug) ? <GameView slug={slug} /> : h === "#/history" ? <History /> : h === "#/login" ? <Login /> : <Home />}</main><Footer /><Toasts /></>;
}
ReactDOM.createRoot(document.getElementById("root")!).render(<Provider><App /></Provider>);
</script>
